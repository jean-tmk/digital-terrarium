*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;transition:.6s;overflow-x:hidden}:root{--bg:#d8efcf;--ink:#183326;--ac:#ffb87a}main{min-height:100vh;padding:28px;position:relative;overflow:hidden}header,footer{display:flex;justify-content:space-between;font:700 10px monospace;letter-spacing:.16em}header{border-bottom:1px solid;padding-bottom:14px}.hero{max-width:1050px;margin:8vh auto 4vh}.hero small{font:700 10px monospace;letter-spacing:.2em}.hero h1{font-size:clamp(3rem,8vw,7.7rem);line-height:.84;letter-spacing:-.065em;margin:.22em 0}.hero p{font-size:clamp(1rem,2vw,1.4rem)}.stage{position:relative;width:min(1050px,94vw);min-height:340px;margin:auto;border:1px solid color-mix(in srgb,var(--ink),transparent 60%);border-radius:28px;padding:clamp(20px,4vw,44px);background:#fff3;box-shadow:0 30px 80px #0002;overflow:hidden}.field{width:min(620px,100%);border:0;border-bottom:2px solid;background:transparent;color:inherit;padding:13px 3px;font-size:clamp(1.05rem,3vw,2rem);outline:none}.action{border:1px solid;background:var(--ac);color:var(--ink);padding:14px 18px;border-radius:999px;font-weight:800;cursor:pointer;box-shadow:4px 4px 0;transition:.2s}.action:active{translate:4px 4px;box-shadow:none}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.output{margin-top:25px;font-size:clamp(1.15rem,3vw,2.2rem);line-height:1.2;max-width:760px}.tile{display:inline-grid;place-items:center;min-width:125px;min-height:95px;margin:7px;border:1px solid;border-radius:16px;padding:14px;background:#fff4;cursor:pointer;transition:.25s}.tile:hover{rotate:-3deg;scale:1.04;background:var(--ac)}.note,.thing{position:absolute;padding:14px;border:1px solid;background:#fff8;box-shadow:5px 6px 0 #0002;user-select:none}.plant{position:absolute;bottom:0;width:7px;background:var(--ink);transform-origin:bottom}.plant:after{content:"";position:absolute;width:23px;height:13px;border-radius:100% 0;background:var(--ac);left:2px;top:20%}.drawer{border:2px solid;border-radius:9px;background:#8e644a22;padding:17px;margin:10px;cursor:pointer}.receipt{background:#fffbe9;color:#292117;width:min(390px,90%);padding:23px;font:14px/1.6 monospace;box-shadow:8px 8px 0 #0002}.museum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:13px}.artifact{min-height:150px;border:1px solid;padding:14px;display:grid;place-items:center;text-align:center;cursor:pointer;background:#fff3}.artifact b{font-size:39px}canvas{position:absolute;inset:0;width:100%;height:100%}textarea{min-height:150px;resize:none}footer{width:min(1050px,94vw);margin:28px auto}a{color:inherit}.era1{--bg:#e9dfc6;--ink:#241d17;--ac:#a33}.era2{--bg:#111;--ink:#68ff68;--ac:#f0f}.era3{--bg:#d9efff;--ink:#21304b;--ac:#ff8aac}.era4{--bg:#f3f0e8;--ink:#121212;--ac:#2459ff}</style></head><body><main><header><span>JEAN / WONDER ROOM EXPERIMENT</span><span>06 OF 17</span></header><section class="hero"><small>BEAUTIFUL DETOUR / TERRARIUM</small><h1>Digital Terrarium</h1><p>Attention is sunlight. Neglect is weather.</p></section><section class="stage" id="stage"></section><footer><span>BUILT FOR CURIOSITY</span><a href="https://github.com/jean-tmk/digital-terrarium">VIEW SOURCE ↗</a></footer></main><script>
const S=document.querySelector('#stage'),P=a=>a[Math.floor(Math.random()*a.length)],E=(x,c,t)=>{let e=document.createElement(x);if(c)e.className=c;if(t!==undefined)e.textContent=t;return e},M='terrarium';let n=0;
function O(t){let o=S.querySelector('.output');if(!o){o=E('div','output');S.append(o)}o.textContent=t;o.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:400})}function I(ph,label,go){let w=E('div','controls'),i=E('input','field'),b=E('button','action',label);i.placeholder=ph;w.append(i,b);S.append(w);b.onclick=()=>go(i.value||ph);i.onkeydown=e=>e.key==='Enter'&&go(i.value||ph)}
if(M==='buttons'){['Do nothing','Add drama','Move elsewhere','Begin ceremony','Regret click','Release one dot'].forEach(x=>{let b=E('button','tile',x);b.onclick=()=>{b.textContent=P(['COMPLETE ✓','WHY?','NOTED','AGAIN?']);b.style.transform='translate('+((Math.random()-.5)*70)+'px,'+((Math.random()-.5)*45)+'px) rotate('+((Math.random()-.5)*18)+'deg)';document.body.style.setProperty('--ac','hsl('+Math.random()*360+' 80% 72%)')};S.append(b)})}

if(M==='museum'){S.classList.add('museum');[['⌛','Loading Forever'],['↖','Custom Cursor'],['★','Under Construction'],['♫','MIDI Memory'],['@','Guestbook'],['░','Dithered Sky']].forEach(a=>{let x=E('div','artifact');x.innerHTML='<b>'+a[0]+'</b><span>'+a[1]+'</span>';x.onclick=()=>x.innerHTML='<b>'+P(['✦','◌','▓','☻'])+'</b><span>'+P(['Artifact activated','You remember this','Please wait… forever','Best viewed at 800×600'])+'</span>';S.append(x)})}

if(M==='terrarium'){O('Click the soil to grow something. Move gently to wake the spores.');S.onclick=e=>{let p=E('i','plant');p.style.left=e.offsetX+'px';p.style.height=(45+Math.random()*180)+'px';p.style.rotate=((Math.random()-.5)*22)+'deg';S.append(p)};S.onpointermove=e=>{if(Math.random()<.035){let q=E('span','thing','✦');q.style.left=e.offsetX+'px';q.style.top=e.offsetY+'px';S.append(q);setTimeout(()=>q.remove(),1200)}}}
if(M==='wrong'){I('Ask something important…','ANSWER INCORRECTLY',v=>O(P(['Obviously, ','Research suggests ','According to one suspicious diagram, '])+v.toLowerCase()+' because '+P(['the moon misplaced the instructions.','Tuesday has seniority.','all reliable chairs voted for it.','blue filed the paperwork first.'])))}
if(M==='weather'){O('FORECAST: still air with a 12% chance of cursor.');let l={x:0,y:0,t:Date.now()};S.onpointermove=e=>{let z=Date.now(),v=Math.hypot(e.clientX-l.x,e.clientY-l.y)/Math.max(1,z-l.t);l={x:e.clientX,y:e.clientY,t:z};O('FORECAST: '+(v>2?'cursor storm':v>.7?'restless crosswinds':'soft drifting air')+' · '+Math.round(v*31)+' km/h')}}
if(M==='dig'){S.innerHTML='<div class="output">Hold and drag to remove the present.</div><canvas></canvas>';let c=S.querySelector('canvas'),x=c.getContext('2d');c.width=1200;c.height=500;x.fillStyle='#183326';x.fillRect(0,0,1200,500);x.fillStyle='#d8efcf';x.font='bold 56px monospace';x.fillText('LAYER 2026 — EXCAVATE',65,120);x.globalCompositeOperation='destination-out';c.onpointermove=e=>{if(e.buttons){let r=c.getBoundingClientRect();x.beginPath();x.arc((e.clientX-r.left)*1200/r.width,(e.clientY-r.top)*500/r.height,50,0,7);x.fill()}}}
if(M==='procrastinate'){I('What should you be doing?','BEGIN AVOIDING',v=>{S.innerHTML='<div class="output">Before “'+v+'”, complete these essential detours:</div>';['alphabetize the tabs','design a flag for the task','research spoon history','rename every folder','make an Almost Working playlist'].sort(()=>Math.random()-.5).slice(0,4).forEach(q=>S.append(E('button','tile',q)))})}
if(M==='creature'){S.innerHTML='<div class="output">Your visitor is nervous. Move slowly. Click to adopt.</div><div id="pet" style="position:absolute;font-size:54px;left:50%;top:55%;transition:.16s">◉ᴥ◉</div>';let p=S.querySelector('#pet');S.onpointermove=e=>{p.style.left=e.offsetX+'px';p.style.top=e.offsetY+'px'};S.onclick=()=>{let z=prompt('Name this cursor creature:');if(z)O(z+' has agreed to follow you until this tab closes.')}} 
if(M==='drawer'){O('There is probably a bottom.');let d=E('div','drawer','OPEN DRAWER 01');S.append(d);d.onclick=function(e){e.stopPropagation();n++;let q=E('div','drawer',n<7?'OPEN DRAWER '+String(n+1).padStart(2,'0'):P(['A SMALL MOON','ONE LOST THOUGHT','THE BOTTOM?','A DRAWER LABELED TOP']));this.append(q);q.onclick=this.onclick}}
if(M==='memory'){I('Insert one word…','DISPENSE',v=>{S.querySelectorAll('.receipt').forEach(x=>x.remove());let r=E('div','receipt');r.innerHTML='MEMORY VENDING CO.<br>————————————<br>INPUT: '+v.toUpperCase()+'<br><br>'+P(['You carried it home in rain that never happened.','It waited in a drawer you did not own.','Someone said your name from next summer.','The room smelled like lemons and almost remembering.'])+'<br><br>NO REFUNDS ON IMAGINED EVENTS';S.append(r)})}
if(M==='gravity'){['TITLE','BUTTON','IMPORTANT NOTE','SMALL PLANET','NAVIGATION','ONE IDEA'].forEach((t,i)=>{let x=E('div','thing',t);x.style.left=(8+i*14)+'%';x.style.top=(35+i%3*70)+'px';S.append(x)});O('Click anywhere to renegotiate gravity.');S.onclick=()=>S.querySelectorAll('.thing').forEach(x=>{x.style.transition='2s cubic-bezier(.2,.8,.3,1)';x.style.transform='translate('+((Math.random()-.5)*300)+'px,'+(180+Math.random()*100)+'px) rotate('+(Math.random()*240)+'deg)'})}
if(M==='music'){O('Click to begin. Every position has a pitch.');let a;S.onclick=e=>{a=a||new AudioContext();let o=a.createOscillator(),g=a.createGain();o.frequency.value=120+(e.offsetX/S.clientWidth)*760;o.type=P(['sine','triangle','square']);g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.7);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.72);let q=E('span','thing','♪');q.style.left=e.offsetX+'px';q.style.top=e.offsetY+'px';S.append(q);setTimeout(()=>q.remove(),800)}}
if(M==='thought'){I('I keep thinking about…','EXCHANGE',v=>O(v+' '+P(['until the room develops another door.','but only when nobody measures it.','and perhaps that is where the map begins.','because unfinished things cast complete shadows.','while tomorrow rearranges the evidence.'])))}
if(M==='typewriter'){S.innerHTML='<textarea class="field" placeholder="Begin typing through time…"></textarea><div class="output">ERA: waiting</div>';let q=S.querySelector('textarea');q.oninput=()=>{let e=1+(Math.floor(q.value.length/18)%4);document.body.className='era'+e;O('ERA: '+['','LETTERPRESS / 1897','TERMINAL / 1984','PERSONAL WEB / 2003','AFTER THE INTERFACE / 2049'][e])}}
</script></body></html>
