<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Terrarium — Habitat 06</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Manrope:wght@300;400;500&family=Newsreader:ital,wght@0,400;1,400&display=swap');:root{--ink:#e9f0e3;--acid:#c8f56f;--blue:#7185ff;--pink:#ff93ba;--line:#dce9d52b}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07110e;color:var(--ink);font-family:Manrope}button{font:inherit;color:inherit}.app{height:100svh;position:relative;background:radial-gradient(circle at 50% 43%,#18382b 0,#091713 45%,#040a08 100%)}.app:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#b7d7bf0c 1px,transparent 1px),linear-gradient(90deg,#b7d7bf0c 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle,#000,transparent 78%)}.top{position:absolute;z-index:20;left:0;right:0;top:0;height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{display:flex;gap:13px;align-items:center}.mark{width:34px;height:34px;border:1px solid #dcebd6;border-radius:50%;position:relative}.mark:before{content:"";position:absolute;width:1px;height:21px;background:#dcebd6;left:16px;top:5px;rotate:32deg}.mark:after{content:"";position:absolute;width:10px;height:6px;border:1px solid #dcebd6;border-left:0;border-bottom:0;border-radius:100% 0;left:16px;top:7px}.brand b{font:400 18px Newsreader}.micro{font:500 8px DM Mono;letter-spacing:.17em;text-transform:uppercase}.muted{color:#92a298}.live{display:flex;gap:8px;align-items:center}.live i{width:6px;height:6px;border-radius:50%;background:var(--acid);box-shadow:0 0 14px var(--acid)}.intro{position:absolute;z-index:12;left:5vw;top:50%;translate:0 -48%;width:290px}.intro h1{font:400 clamp(55px,6vw,88px)/.8 Newsreader;letter-spacing:-.06em;margin:20px 0 24px}.intro h1 em{display:block;color:var(--pink)}.intro p{font-size:12px;line-height:1.75;color:#acb9b0}.enter{margin-top:25px;border:1px solid #dfe9da66;background:#e8efe3;color:#112119;border-radius:99px;padding:13px 18px;cursor:pointer;font:500 8px DM Mono;letter-spacing:.13em}.habitat{position:absolute;z-index:5;left:53%;top:52%;translate:-50% -50%;width:min(760px,55vw);height:min(76vh,720px);perspective:1200px}.glass{position:absolute;inset:3% 4% 6%;border:1px solid #dff5e65c;border-radius:46% 46% 11% 11%/29% 29% 7% 7%;background:linear-gradient(115deg,#ffffff12,transparent 20%,transparent 74%,#ffffff09),linear-gradient(#17302735,#07110b70);box-shadow:inset 24px 0 55px #fff1,inset -30px -20px 60px #0006,0 45px 100px #000a;overflow:hidden;transition:.8s}.glass:before{content:"";position:absolute;z-index:12;left:9%;top:8%;width:3px;height:62%;background:linear-gradient(transparent,#ffffff78,transparent);rotate:7deg;filter:blur(1px)}.glass:after{content:"";position:absolute;z-index:12;inset:1%;border:1px solid #ffffff13;border-radius:inherit;pointer-events:none}.soil{position:absolute;left:-5%;right:-5%;bottom:-2%;height:28%;border-radius:50% 50% 0 0/25% 25% 0 0;background:linear-gradient(#453a2d,#1c1912 62%,#0c0e0a);box-shadow:inset 0 12px 25px #0008}.layer{position:absolute;object-fit:contain;transform-origin:50% 100%;filter:drop-shadow(0 16px 22px #0007);transition:.8s cubic-bezier(.16,.8,.2,1)}.moss{z-index:4;width:72%;left:2%;bottom:11%;animation:breathe 7s ease-in-out infinite alternate}.pond{z-index:5;width:53%;right:-1%;bottom:9%}.fern{z-index:3;width:42%;left:-7%;bottom:8%;animation:sway 6s ease-in-out infinite alternate}.pitcher{z-index:5;width:39%;right:-3%;top:-6%;transform-origin:50% 0;animation:hang 8s ease-in-out infinite alternate}.butterfly,.moth{z-index:9;width:9%;filter:drop-shadow(0 5px 7px #0007);cursor:pointer}.butterfly{left:56%;top:35%;animation:fly 13s ease-in-out infinite alternate}.moth{left:42%;top:28%;opacity:0;animation:fly2 16s ease-in-out infinite alternate}.mist{position:absolute;z-index:8;inset:0;opacity:0;background:linear-gradient(transparent 32%,#d9eee52c 60%,transparent);filter:blur(15px);transition:.7s;pointer-events:none}.drops{position:absolute;z-index:11;inset:2%;opacity:0;background-image:radial-gradient(ellipse,#e4f7ef77 0 1px,transparent 2px),radial-gradient(ellipse,#e4f7ef55 0 1.5px,transparent 2.5px);background-size:43px 36px,67px 59px;transition:.6s;pointer-events:none}.cap{position:absolute;z-index:14;width:34%;height:5%;left:33%;top:0;border:1px solid #94a69a;border-radius:50%;background:linear-gradient(#66766c,#26352d)}.base{position:absolute;z-index:14;left:0;right:0;bottom:0;height:10%;border:1px solid #53645a;border-radius:12px 12px 45% 45%/12px 12px 45% 45%;background:linear-gradient(#304238,#0d1712);box-shadow:0 25px 40px #0008}.base:after{content:"HABITAT 06  /  CLOSED-LOOP MICROFOREST";position:absolute;left:50%;top:45%;translate:-50% -50%;white-space:nowrap;font:400 7px DM Mono;letter-spacing:.18em;color:#8ea094}@keyframes breathe{to{transform:scale(1.025) translateY(-5px)}}@keyframes sway{to{transform:rotate(2deg)}}@keyframes hang{to{transform:rotate(-1.8deg)}}@keyframes fly{25%{transform:translate(70px,-35px) rotate(8deg)}55%{transform:translate(-40px,60px) rotate(-5deg)}100%{transform:translate(105px,120px) scale(.72)}}@keyframes fly2{45%{transform:translate(-90px,40px)}100%{transform:translate(75px,95px) scale(.8)}}.tools{position:absolute;z-index:20;right:28px;top:50%;translate:0 -50%;display:grid;gap:6px;padding:8px;border:1px solid var(--line);border-radius:99px;background:#07110dbd;backdrop-filter:blur(18px)}.tools button{width:46px;height:46px;border:0;border-radius:50%;background:transparent;cursor:pointer;font:500 11px DM Mono}.tools button:hover,.tools button.active{background:#ebf0e4;color:#102018}.readout{position:absolute;z-index:18;right:6vw;bottom:26px;display:flex;gap:28px;border-top:1px solid var(--line);padding-top:13px}.readout b{display:block;font:400 24px Newsreader}.night .app{background:radial-gradient(circle at 50% 43%,#182343,#080d20 50%,#03050c)}.night .glass{background:linear-gradient(115deg,#ffffff0b,transparent 20%),linear-gradient(#0c183f66,#030712aa)}.night .moth{opacity:1}.night .butterfly{opacity:.18}.fog .mist{opacity:1}.rain .drops{opacity:1}.rain .pond{filter:brightness(.86) saturate(.85) drop-shadow(0 16px 22px #0007)}.growth .moss{transform:scale(1.08) translateY(-12px)}.open .glass{transform:translateY(-24px) scale(1.02);box-shadow:inset 24px 0 55px #fff1,0 70px 130px #000b}.open .cap{transform:translateY(-30px);transition:.8s}.toast{position:absolute;z-index:30;left:50%;bottom:25px;translate:-50% 20px;background:#eaf0e4;color:#102018;padding:11px 15px;border-radius:3px;font:500 8px DM Mono;letter-spacing:.1em;opacity:0;transition:.3s}.toast.show{opacity:1;translate:-50% 0}@media(max-width:900px){.intro{left:25px;width:230px}.habitat{width:68vw;left:58%}.readout{display:none}}@media(max-width:600px){.top{padding:0 16px}.live span{display:none}.intro{top:auto;bottom:28px;translate:0;width:55vw}.intro h1{font-size:52px}.intro p{display:none}.habitat{width:102vw;height:65vh;left:50%;top:43%}.tools{right:10px}.pitcher{right:3%}}</style></head><body><main class="app" id="app"><header class="top"><div class="brand"><span class="mark"></span><div><b>Digital Terrarium</b><div class="micro muted">JEAN / LIVING SYSTEM 06</div></div></div><div class="live micro"><i></i><span>HABITAT STABLE</span></div></header><section class="intro"><div class="micro" style="color:var(--acid)">A WORLD SMALL ENOUGH TO NOTICE</div><h1>Keep a little<br><em>weather</em><br>alive.</h1><p>A closed-loop habitat with independently living layers. Change its climate, wake its residents, and watch the glass remember.</p><button class="enter" id="hatch">OPEN THE HATCH →</button></section><div class="habitat"><div class="glass"><div class="soil"></div><img class="layer fern" src="assets/foreground-fronds.webp"><img class="layer moss" src="assets/moss-garden.webp"><img class="layer pond" src="assets/frog-pond.webp"><img class="layer pitcher" src="assets/pitcher-vine.webp"><img class="layer butterfly" id="butterfly" src="assets/glasswing.webp"><img class="layer moth" src="assets/luna-moth.webp"><div class="mist"></div><div class="drops"></div></div><div class="cap"></div><div class="base"></div></div><nav class="tools"><button data-act="mist" title="Mist">M</button><button data-act="rain" title="Rain">R</button><button data-act="grow" title="Grow">G</button><button data-act="night" title="Night">N</button><button data-act="call" title="Call butterfly">B</button></nav><div class="readout"><div class="micro muted">HUMIDITY<b id="humidity">78%</b></div><div class="micro muted">BIODIVERSITY<b id="bio">24</b></div><div class="micro muted">LIGHT<b id="light">62%</b></div></div><div class="toast" id="toast"></div></main><script>const app=document.querySelector('#app'),toast=document.querySelector('#toast');let hum=78,bio=24,open=false;function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1900)}document.querySelectorAll('.tools button').forEach(b=>b.onclick=()=>{let a=b.dataset.act;b.classList.toggle('active');if(a==='mist'){app.classList.toggle('fog');hum=Math.min(99,hum+4);say('Mist settles inside the glass')}if(a==='rain'){app.classList.toggle('rain');hum=Math.min(99,hum+8);say('Condensation gathers and the pond deepens')}if(a==='grow'){app.classList.toggle('growth');bio+=2;say('The understory opens new leaves')}if(a==='night'){app.classList.toggle('night');light.textContent=app.classList.contains('night')?'18%':'62%';say(app.classList.contains('night')?'The luna moth wakes':'Daylight returns')}if(a==='call'){let f=document.querySelector('#butterfly');f.style.animationDuration='3s';setTimeout(()=>f.style.animationDuration='13s',4500);say('The glasswing circles closer')}humidity.textContent=hum+'%';bio=document.querySelector('#bio').textContent=bio});hatch.onclick=()=>{open=!open;app.classList.toggle('open',open);hatch.textContent=open?'CLOSE THE HATCH ←':'OPEN THE HATCH →';say(open?'Fresh air enters the habitat':'The loop is sealed again')};document.querySelector('.pond').onclick=()=>{say('The frog jumps to the next warm stone');document.querySelector('.pond').animate([{transform:'translateY(0)'},{transform:'translateY(-9px)'},{transform:'translateY(0)'}],{duration:700})};</script></body></html>
